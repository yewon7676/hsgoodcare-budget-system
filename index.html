<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>화성시장기요양지원센터 맞춤형 수입·지출결의 및 예산관리 시스템 V20 (보안강화)</title>
    
    <!-- Supabase JS SDK, Chart.js, SheetJS 연동 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <script>
        const SUPABASE_URL = 'https://wpledqyjtxifytwpaeqm.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndwbGVkcXlqdHhpZnl0d3BhZXFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3MDY3OTAsImV4cCI6MjEwNDI4Mjc5MH0.22on-IzflOk-3jGZaXvfKa9IbhSJX5OGGZ8lxm3xQZ4';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>

    <style>
        :root {
            --primary-color: #2b6cb0;
            --primary-hover: #2c5282;
            --income-color: #2b8a3e;
            --income-hover: #237032;
            --bg-color: #f7fafc;
            --border-color: #e2e8f0;
            --text-color: #2d3748;
            --danger-color: #e53e3e;
            --success-color: #38a169;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; line-height: 1.6; }
        .container { max-width: 1350px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid var(--primary-color); padding-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        header h1 { font-size: 22px; color: var(--primary-color); }

        .auth-status-bar { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: bold; }
        .user-badge { background: #e2e8f0; padding: 4px 8px; border-radius: 4px; color: #2d3748; }

        /* 로그인 모달 스타일 */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .login-box { background: #fff; padding: 30px; border-radius: 8px; width: 360px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .login-box h2 { font-size: 18px; color: var(--primary-color); margin-bottom: 20px; text-align: center; }
        .login-box .form-group { margin-bottom: 15px; }
        .login-box input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid var(--border-color); border-radius: 4px; }
        .login-btn { width: 100%; padding: 10px; background: var(--primary-color); color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .login-btn:hover { background: var(--primary-hover); }
        .error-msg { color: var(--danger-color); font-size: 12px; margin-top: 8px; display: none; }

        /* 기존 스타일 생략 (동일 유지) */
        .backup-control-bar { display: flex; gap: 10px; align-items: center; background: #edf2f7; padding: 8px 15px; border-radius: 6px; }
        .btn-sm { padding: 4px 8px; font-size: 12px; cursor: pointer; }
        .btn-secondary { background-color: #718096; color: white; border: none; border-radius: 4px; }
    </style>
</head>
<body>

<!-- 로그인 모달 -->
<div id="login-modal" class="modal-overlay">
    <div class="login-box">
        <h2>센터 시스템 로그인</h2>
        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="login-email">이메일 계정</label>
                <input type="email" id="login-email" required placeholder="admin@hswelfare.or.kr">
            </div>
            <div class="form-group">
                <label for="login-password">비밀번호</label>
                <input type="password" id="login-password" required placeholder="••••••••">
            </div>
            <div id="login-error" class="error-msg">이메일 또는 비밀번호가 올바르지 않습니다.</div>
            <button type="submit" class="login-btn">로그인</button>
        </form>
    </div>
</div>

<div class="container" id="main-app" style="display:none;">
    <header>
        <h1>화성시장기요양지원센터 맞춤형 수입·지출결의 및 예산관리 시스템 V20</h1>
        
        <div class="auth-status-bar">
            <span id="user-display" class="user-badge">인증 확인 중...</span>
            <button class="btn-sm btn-secondary" onclick="handleLogout()">로그아웃</button>
        </div>
    </header>

    <!-- 기존 탭 및 애플리케이션 영역 이하 동일 -->
</div>

<script>
    // 로그인 처리
    async function handleLogin(e) {
        e.preventDefault();
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;
        const errorBox = document.getElementById('login-error');

        errorBox.style.display = 'none';

        const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

        if (error) {
            errorBox.innerText = '로그인 실패: ' + error.message;
            errorBox.style.display = 'block';
        } else {
            checkAuthAndInit();
        }
    }

    // 로그아웃 처리
    async function handleLogout() {
        await supabaseClient.auth.signOut();
        location.reload();
    }

    // 인증 상태 확인 및 화면 처리
    async function checkAuthAndInit() {
        const { data: { session } } = await supabaseClient.auth.getSession();

        if (session) {
            document.getElementById('login-modal').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            document.getElementById('user-display').innerText = `👤 ${session.user.email}`;
            initSystem();
        } else {
            document.getElementById('login-modal').style.display = 'flex';
            document.getElementById('main-app').style.display = 'none';
        }
    }

    // 초기화 실행
    checkAuthAndInit();
</script>

</body>
</html>
